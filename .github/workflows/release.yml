name: Release

# Publishes to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# Uses PyPI trusted publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org: project "rfbcalc" -> Publishing -> add GitHub
# publisher (owner RAFAELDCOELHO, repo rfbcalc, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Tag must match the package version
        run: |
          pkg=$(ls dist/*.whl | sed -E 's/.*rfbcalc-([^-]+)-.*/\1/')
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$pkg"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Publicado no PyPI: https://pypi.org/project/rfbcalc/${GITHUB_REF_NAME#v}/ — veja o CHANGELOG.md para os detalhes."
